<html lang="en">
<head>

<title>Step 3 — The Roman Colonnade &amp; Interactive Guides</title>
<style>

    display: block;

<body>

<canvas id="app-canvas"></canvas>
<div id="phase-label">Phase: Intro — Hourglass</div>

<!-- RPG dialogue overlay — populated/shown by openDialogue() in section 15. -->
<div id="dialogue-box" class="dialogue-hidden">
  <div class="dialogue-panel">
    <button id="dialogue-close" aria-label="Close dialogue">&times;</button>
    <div id="dialogue-name" class="dialogue-name"></div>

<!--
  ======================================================================
  IMPORT MAP
  ======================================================================
  Loading Three.js as an ES module straight from a CDN (jsDelivr) so we
  don't need a bundler. "three" resolves to the core library; anything
  under "three/addons/" resolves to the examples/jsm folder, which is
  where OrbitControls and GLTFLoader live.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
// ^ Uncomment when you're ready to swap in real hourglass/archway/guide
// models. See "SWAPPING IN A REAL GLTF MODEL" near the bottom of this file.

/* ====================================================================
   1. RENDERER / SCENE / CAMERA
   ==================================================================== */

const canvas = document.getElementById('app-canvas');
const phaseLabel = document.getElementById('phase-label');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // soft, filmic shadow edges
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; // gives that "graded" AAA look
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();

// Start in a near-black studio void. This color is animated toward a
// warm golden-hour desert sky during the DESERT REVEAL phase (see
// updateLighting further down), then dimmed again once we step inside
// the colonnade (see updateHallwayLighting).
scene.background = new THREE.Color(0x05050a);
scene.fog = new THREE.FogExp2(0x05050a, 0.035);

// Near plane starts intentionally TINY (0.001) because the intro camera
// dive pushes right up against the sand mound. Once that close-up shot is
// over we relax it (see the 'traveling' transition in the render loop).
const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.001,
  1000 // covers the full dune field, the archway, and the colonnade beyond it
);

/* ====================================================================
   2. LIGHTING — "studio" state (dark room, hard key light)
   ==================================================================== */

// Ambient light: just enough to keep shadows from going pure black.
const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambientLight);

// A hemisphere light gives a believable sky/ground color split once we
// reach the desert. It starts fully desaturated/dim in the studio phase
// and gets "switched on" during the reveal, then dimmed again indoors.
const hemiLight = new THREE.HemisphereLight(0x111122, 0x000000, 0.15);
scene.add(hemiLight);

// The hard studio key light — a tight spotlight that only needs to rake
// across the small hourglass. It fades out completely during the reveal
// and is replaced by `sunLight` (section 6) for the desert.
const keyLight = new THREE.SpotLight(0xffffff, 6.0);
keyLight.position.set(4, 8, 5);
keyLight.angle = Math.PI / 10;   // narrow cone = "sharp" spotlight look
keyLight.penumbra = 0.25;
keyLight.decay = 1.5;
keyLight.distance = 60;
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 40;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);
scene.add(keyLight.target);
keyLight.target.position.set(0, 0, 0);

// A cool rim light from behind, purely for silhouette definition on the
// glass edges while we're still in the dark studio.
const rimLight = new THREE.PointLight(0x6688ff, 1.2, 20);
rimLight.position.set(-3, 2, -4);
scene.add(rimLight);

/* ====================================================================
   3. THE HOURGLASS (placeholder geometry)
   ====================================================================
   Built from two cones meeting tip-to-tip at the origin, plus metallic
   disc caps and thin corner posts to suggest a frame. Everything lives
   inside `hourglassGroup` so the whole assembly can be faded / hidden
   as a single unit later (see the GLTF swap notes at the bottom).
*/

const hourglassGroup = new THREE.Group();
scene.add(hourglassGroup);

const BULB_RADIUS = 1.6;
const BULB_HEIGHT = 3.2;

// Semi-transparent "glass" — physically based transmission gives a much
// more convincing glass look than plain alpha blending.
const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xbfd9ff,
  metalness: 0,
  roughness: 0.05,
  transmission: 1.0,
  thickness: 1.2,
  ior: 1.45,
  transparent: true,
  opacity: 1.0,            // driven down to 0 during the DESERT REVEAL fade
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
  side: THREE.DoubleSide,
});

const topBulbGeo = new THREE.ConeGeometry(BULB_RADIUS, BULB_HEIGHT, 24, 1, true);
const topBulb = new THREE.Mesh(topBulbGeo, glassMaterial);
topBulb.rotation.x = Math.PI; // flip so the apex faces the origin
topBulb.position.y = BULB_HEIGHT / 2;
topBulb.castShadow = true;
topBulb.receiveShadow = true;
hourglassGroup.add(topBulb);

const bottomBulbGeo = new THREE.ConeGeometry(BULB_RADIUS, BULB_HEIGHT, 24, 1, true);
const bottomBulb = new THREE.Mesh(bottomBulbGeo, glassMaterial);
bottomBulb.position.y = -BULB_HEIGHT / 2;
bottomBulb.castShadow = true;
bottomBulb.receiveShadow = true;
hourglassGroup.add(bottomBulb);

const capMaterial = new THREE.MeshStandardMaterial({
  color: 0x8a7350,
  metalness: 1.0,
  roughness: 0.45,
  transparent: true,
  opacity: 1.0,
});
const capGeo = new THREE.CylinderGeometry(BULB_RADIUS * 1.05, BULB_RADIUS * 1.05, 0.25, 24);

const topCap = new THREE.Mesh(capGeo, capMaterial);
topCap.position.y = BULB_HEIGHT + 0.1;
topCap.castShadow = true;
topCap.receiveShadow = true;
hourglassGroup.add(topCap);

const bottomCap = new THREE.Mesh(capGeo, capMaterial);
bottomCap.position.y = -BULB_HEIGHT - 0.1;
bottomCap.castShadow = true;
bottomCap.receiveShadow = true;
hourglassGroup.add(bottomCap);

const postMaterial = capMaterial;
const postGeo = new THREE.CylinderGeometry(0.06, 0.06, BULB_HEIGHT * 2 + 0.5, 8);
const postPositions = [
  [BULB_RADIUS * 0.95, 0, 0],
  [-BULB_RADIUS * 0.95, 0, 0],
  [0, 0, BULB_RADIUS * 0.95],
  [0, 0, -BULB_RADIUS * 0.95],
];
postPositions.forEach(([x, y, z]) => {
  const post = new THREE.Mesh(postGeo, postMaterial);
  post.position.set(x, y, z);
  post.castShadow = true;
  hourglassGroup.add(post);
});

const SAND_COLOR = 0xe1b382; // same warm desert tone used for the dunes/stone later

const sandMaterial = new THREE.MeshStandardMaterial({
  color: SAND_COLOR,
  roughness: 1.0,
  metalness: 0.0,
});

const sandMoundGeo = new THREE.ConeGeometry(BULB_RADIUS * 0.55, 1.1, 20);
const sandMound = new THREE.Mesh(sandMoundGeo, sandMaterial);
sandMound.position.y = -BULB_HEIGHT + 0.55;
sandMound.castShadow = true;
sandMound.receiveShadow = true;
hourglassGroup.add(sandMound);

/* ====================================================================
   4. LEVEL LAYOUT CONSTANTS
   ====================================================================
   Every downstream system — the dune-flattening noise, the archway, the
   colonnade, the guides, and the travel camera — needs to agree on where
   things sit in the world. Declaring them all together, up front, means
   changing one number here (e.g. how long the hallway is) automatically
   keeps the terrain, the architecture, and the camera paths in sync.
*/

const ARCH_Z = -90;        // how far ahead (world -Z) of the hourglass the archway stands
const ARCH_GAP = 9;        // half the distance between the two arch pillars == the arch's radius
const PILLAR_WIDTH = 3.4;
const PILLAR_DEPTH = 7;
const PILLAR_HEIGHT = 12.5;
const ARCH_TUBE = 1.4;

const HALLWAY_START_Z = -98;         // just past the archway's inner face
const HALLWAY_LENGTH = 190;
const HALLWAY_END_Z = HALLWAY_START_Z - HALLWAY_LENGTH; // -288
const COLUMN_OFFSET = 8;             // colonnade columns sit this far either side of the centerline
const COLUMN_SPACING = 16;
const N_COLUMNS = Math.floor(HALLWAY_LENGTH / COLUMN_SPACING); // columns per side

/* ====================================================================
   5. DESERT TERRAIN — wavy dunes via noise-displaced geometry
   ====================================================================
   A cheap, dependency-free 2D value-noise function (hash + smoothstep
   bilinear interpolation) driving a fractal-Brownian-motion (fbm) sum of
   a few octaves — done on the CPU at load time (rather than purely in a
   vertex shader) specifically so `getTerrainHeight()` can also be READ
   BACK by JS, to place the archway's feet and to keep the camera glued
   to the surface during the travel flythrough.
*/

function hash2D(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}

function valueNoise2D(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf); // smoothstep, not linear — kills grid-line artifacts
  const v = zf * zf * (3 - 2 * zf);

  const a = hash2D(xi, zi);
  const b = hash2D(xi + 1, zi);
  const c = hash2D(xi, zi + 1);
  const d = hash2D(xi + 1, zi + 1);

  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a, b, u), THREE.MathUtils.lerp(c, d, u), v);
}

function fbm2D(x, z, octaves = 4, lacunarity = 2.0, gain = 0.5) {
  let amplitude = 0.5, frequency = 1.0, sum = 0, max = 0;
  for (let i = 0; i < octaves; i++) {
    sum += valueNoise2D(x * frequency, z * frequency) * amplitude;
    max += amplitude;
    amplitude *= gain;
    frequency *= lacunarity;
  }
  return sum / max;
}

// Converts noise into a signed world-space height offset, then smoothly
// flattens a "capsule" running the length of the ENTIRE walked path — from
// the hourglass landing spot, through the archway, to the far end of the
// colonnade — so the flat stone hallway floor and archway foundation never
// fight the bumpy dune mesh underneath them. Distance is measured from the
// nearest point on that path (clamped to its Z-range), which gives a
// rounded, seamless flatten zone with no hard edges anywhere.
function getDuneOffset(x, z) {
  const large = (fbm2D(x * 0.006, z * 0.006, 4) * 2 - 1) * 14;          // big dunes, +-14 units
  const ripples = (fbm2D(x * 0.05 + 50, z * 0.05 + 50, 3) * 2 - 1) * 1.6; // fine ripples, +-1.6 units
  const raw = large + ripples;

  const pathZNear = 10;                 // a little past the hourglass landing spot
  const pathZFar = HALLWAY_END_Z - 20;  // a little past the far end of the colonnade
  const clampedZ = THREE.MathUtils.clamp(z, pathZFar, pathZNear);
  const distFromPath = Math.hypot(x, z - clampedZ);

  const flattenRadius = 16; // wider than the hallway (COLUMN_OFFSET=8) for a clean margin
  const t = THREE.MathUtils.clamp(distFromPath / flattenRadius, 0, 1);
  const flattenFactor = t * t * (3 - 2 * t); // smoothstep

  return raw * flattenFactor;
}

const TERRAIN_BASE_Y = -BULB_HEIGHT + 0.6; // matches Step 1's flat ground height exactly

// Single source of truth for "how tall is the ground at this world x/z" —
// used to build the terrain mesh AND to place the archway/hallway AND to
// keep the travel camera glued to the dune surface outside the colonnade.
function getTerrainHeight(x, z) {
  return TERRAIN_BASE_Y + getDuneOffset(x, z);
}

const TERRAIN_SIZE = 700;      // total width/depth of the desert, in world units
const TERRAIN_SEGMENTS = 160;  // vertex grid resolution per side

const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
terrainGeo.rotateX(-Math.PI / 2); // bake the "lay flat" rotation into the geometry itself

const posAttr = terrainGeo.attributes.position;
for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const z = posAttr.getZ(i);
  posAttr.setY(i, getDuneOffset(x, z)); // TERRAIN_BASE_Y applied once via the mesh's own position, below
}
posAttr.needsUpdate = true;
terrainGeo.computeVertexNormals(); // essential — otherwise the dunes keep flat normals and won't shade

const duneMaterial = new THREE.MeshStandardMaterial({
  color: SAND_COLOR,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.0, // faded in during the desert reveal
});

const duneTerrain = new THREE.Mesh(terrainGeo, duneMaterial);
duneTerrain.position.y = TERRAIN_BASE_Y;
duneTerrain.receiveShadow = true;
scene.add(duneTerrain);

/* ====================================================================
   6. GOLDEN-HOUR SUN
   ====================================================================
   A proper DirectionalLight (parallel rays) rather than the studio
   SpotLight, since a spotlight's cone can't evenly light a landscape
   hundreds of units wide. Off through the studio phase, ramps up with
   the desert reveal, then dims (but doesn't fully die) once we step
   into the colonnade — a little still rakes in between the columns.
*/

const sunLight = new THREE.DirectionalLight(0xffc27a, 0);
sunLight.position.set(140, 45, 90);
sunLight.target.position.set(0, 0, -70);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -150;
sunLight.shadow.camera.right = 150;
sunLight.shadow.camera.top = 150;
sunLight.shadow.camera.bottom = -150;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 400;
sunLight.shadow.bias = -0.0008;
scene.add(sunLight);
scene.add(sunLight.target);

/* ====================================================================
   7. THE ROMAN ARCHWAY
   ====================================================================
   A procedural triumphal-arch silhouette (loosely after the Arch of
   Septimius Severus): BoxGeometry pillars + a half TorusGeometry
   (arc = PI) spanning between their tops, scaled along Z so its tube
   reads as a real walk-through passage rather than a flat ring.
*/

function createRomanArchway() {
  const group = new THREE.Group();

  const marble = new THREE.MeshStandardMaterial({
    color: 0xe8e0cf, roughness: 0.85, metalness: 0.02, transparent: true, opacity: 0,
  });
  const marbleDark = new THREE.MeshStandardMaterial({
    color: 0xcfc4a8, roughness: 0.9, metalness: 0.02, transparent: true, opacity: 0,
  });

  // Both pillars share ONE height sample (rather than each sampling its
  // own x) so the arch's two feet — which assume equal pillar heights —
  // actually meet the tops cleanly.
  const baseY = getTerrainHeight(0, ARCH_Z);

  [-1, 1].forEach((side) => {
    const x = side * ARCH_GAP;

    const plinth = new THREE.Mesh(
      new THREE.BoxGeometry(PILLAR_WIDTH + 1, 1.4, PILLAR_DEPTH + 1),
      marbleDark
    );
    plinth.position.set(x, baseY + 0.7, ARCH_Z);
    group.add(plinth);

    const shaftHeight = PILLAR_HEIGHT - 1.4;
    const shaft = new THREE.Mesh(
      new THREE.BoxGeometry(PILLAR_WIDTH, shaftHeight, PILLAR_DEPTH),
      marble
    );
    shaft.position.set(x, baseY + 1.4 + shaftHeight / 2, ARCH_Z);
    group.add(shaft);
  });

  // arc = Math.PI sweeps exactly the TOP half of the ring — an upward
  // arch shape whose two ends land at (+radius,0) and (-radius,0), right
  // where the pillar tops are. No extra rotation needed.
  const archCurve = new THREE.Mesh(
    new THREE.TorusGeometry(ARCH_GAP, ARCH_TUBE, 16, 48, Math.PI),
    marble
  );
  archCurve.position.set(0, baseY + PILLAR_HEIGHT, ARCH_Z);
  archCurve.scale.z = PILLAR_DEPTH / (ARCH_TUBE * 2); // stretch the tube into a real barrel vault
  group.add(archCurve);

  const atticY = baseY + PILLAR_HEIGHT + ARCH_GAP + ARCH_TUBE + 1.1;
  const attic = new THREE.Mesh(
    new THREE.BoxGeometry(ARCH_GAP * 2 + PILLAR_WIDTH * 1.6, 2.2, PILLAR_DEPTH + 1),
    marbleDark
  );
  attic.position.set(0, atticY, ARCH_Z);
  group.add(attic);

  group.traverse((child) => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });

  return { group, materials: [marble, marbleDark] };
}

const { group: archwayGroup, materials: archMaterials } = createRomanArchway();
scene.add(archwayGroup);

/* ====================================================================
   8. THE ROMAN COLONNADE HALLWAY
   ====================================================================
   Two rows of towering columns (CylinderGeometry shaft + BoxGeometry
   base/capital), a flat stone floor, and a high ceiling. Warm SpotLights
   hang between the columns, pooling dramatic light on the floor — only a
   handful cast real shadows, since shadow maps are the single most
   expensive thing a light can do and we already have the sun doing one.
*/

const HALLWAY_FLOOR_Y = getTerrainHeight(0, ARCH_Z); // flat by construction (see the path-flatten capsule above)
const COLUMN_BASE_HEIGHT = 1;
const COLUMN_SHAFT_HEIGHT = 11;
const COLUMN_CAP_HEIGHT = 1;
const COLUMN_TOTAL_HEIGHT = COLUMN_BASE_HEIGHT + COLUMN_SHAFT_HEIGHT + COLUMN_CAP_HEIGHT;
const CEILING_Y = HALLWAY_FLOOR_Y + COLUMN_TOTAL_HEIGHT + 2.5;

const hallwayGroup = new THREE.Group();
scene.add(hallwayGroup);

const stoneMaterial = new THREE.MeshStandardMaterial({ color: 0xcdbf9d, roughness: 0.85, metalness: 0.03 });
const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xb7a888, roughness: 0.92, metalness: 0.02 });
const ceilingMaterial = new THREE.MeshStandardMaterial({
  color: 0x8f8570, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide,
});

function createColumn(x, z) {
  const group = new THREE.Group();

  const base = new THREE.Mesh(new THREE.BoxGeometry(2.4, COLUMN_BASE_HEIGHT, 2.4), stoneMaterial);
  base.position.y = COLUMN_BASE_HEIGHT / 2;
  group.add(base);

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.0, COLUMN_SHAFT_HEIGHT, 20), stoneMaterial);
  shaft.position.y = COLUMN_BASE_HEIGHT + COLUMN_SHAFT_HEIGHT / 2;
  group.add(shaft);

  const cap = new THREE.Mesh(new THREE.BoxGeometry(2.2, COLUMN_CAP_HEIGHT, 2.2), stoneMaterial);
  cap.position.y = COLUMN_BASE_HEIGHT + COLUMN_SHAFT_HEIGHT + COLUMN_CAP_HEIGHT / 2;
  group.add(cap);

  group.traverse((child) => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });

  group.position.set(x, HALLWAY_FLOOR_Y, z);
  return group;
}

// One Z position per column pair, spaced evenly down the hallway. Stored
// for reuse below so the Roman guides can stand next to specific columns.
const columnZs = [];
for (let i = 0; i < N_COLUMNS; i++) {
  const z = HALLWAY_START_Z - (i + 0.5) * COLUMN_SPACING;
  columnZs.push(z);
  hallwayGroup.add(createColumn(-COLUMN_OFFSET, z));
  hallwayGroup.add(createColumn(COLUMN_OFFSET, z));
}

const hallwayCenterZ = (HALLWAY_START_Z + HALLWAY_END_Z) / 2;

const hallwayFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(COLUMN_OFFSET * 2 + 8, HALLWAY_LENGTH + 8),
  floorMaterial
);
hallwayFloor.rotation.x = -Math.PI / 2;
hallwayFloor.position.set(0, HALLWAY_FLOOR_Y, hallwayCenterZ);
hallwayFloor.receiveShadow = true;
hallwayGroup.add(hallwayFloor);

const hallwayCeiling = new THREE.Mesh(
  new THREE.PlaneGeometry(COLUMN_OFFSET * 2 + 8, HALLWAY_LENGTH + 8),
  ceilingMaterial
);
hallwayCeiling.rotation.x = Math.PI / 2;
hallwayCeiling.position.set(0, CEILING_Y, hallwayCenterZ);
hallwayGroup.add(hallwayCeiling);

// One lamp per GAP between consecutive column pairs — i.e. genuinely
// "between the columns" rather than colocated with one.
const lampZs = [];
for (let i = 0; i < columnZs.length - 1; i++) {
  lampZs.push((columnZs[i] + columnZs[i + 1]) / 2);
}

const MAX_SHADOW_SPOTLIGHTS = 4; // cap how many colonnade lights get a real (expensive) shadow map
let shadowSpotlightCount = 0;

lampZs.forEach((z, i) => {
  const spot = new THREE.SpotLight(0xffaa55, 4.5, 22, Math.PI / 5, 0.55, 1.5);
  spot.position.set(0, CEILING_Y - 1.5, z);
  spot.target.position.set(0, HALLWAY_FLOOR_Y, z);
  hallwayGroup.add(spot);
  hallwayGroup.add(spot.target);

  if (shadowSpotlightCount < MAX_SHADOW_SPOTLIGHTS && i % Math.ceil(lampZs.length / MAX_SHADOW_SPOTLIGHTS) === 0) {
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024, 1024);
    spot.shadow.bias = -0.001;
    shadowSpotlightCount++;
  }
});

/* ====================================================================
   9. THE INTERACTIVE ROMAN GUIDES
   ====================================================================
   Each guide is a Group (cylinder body + sphere head + a thin torus
   sash) tagged with a name and a pool of dialogue lines in userData —
   that's what the raycaster in section 15 reads when you click one.
*/

const GUIDES = [
  {
    name: 'Marcus the Historian',
    color: 0x8c1c26, // crimson tunic
    side: -1,
    columnIndex: 2,
    lines: [
      "This colonnade echoes the Roman Forum — marble columns once lined the sacred way to the temples.",
      "The arch you passed under recalls Septimius Severus's own, raised in 203 AD to mark his victories in Parthia.",
      "Romans paved their roads in layers of fitted stone so precisely, some are still walkable two thousand years later.",
    ],
  },
  {
    name: 'Gaius the Comedian',
    color: 0xc9a227, // gold tunic
    side: 1,
    columnIndex: 4,
    lines: [
      "Why did the Roman chicken cross the road? To get to the other side of the empire!",
      "I asked a Roman for directions once. He just said 'all roads lead to Rome.' Not helpful — I was already in Rome.",
      "A centurion walks into a bar, holds up two fingers, and says: 'Five beers, please.'",
    ],
  },
  {
    name: 'Livia the Merchant',
    color: 0x8c1c26,
    side: -1,
    columnIndex: 7,
    lines: [
      "I've traded silk from the East and sand-glass from these very dunes — everything passes through this hall eventually.",
      "A caravan can cross the desert in a fortnight, if the winds are kind and the guides are honest.",
    ],
  },
  {
    name: 'Quintus the Guide',
    color: 0xc9a227,
    side: 1,
    columnIndex: 9,
    lines: [
      "Keep walking, traveler — beyond this hall lies the atrium, where the builder's own work and deeds are on display.",
      "Not every hall leads somewhere. This one does.",
    ],
  },
];

function createGuide(def) {
  const z = columnZs[def.columnIndex];
  const x = def.side * (COLUMN_OFFSET - 2.2); // stand just inside the column line, clear of the walking path

  const group = new THREE.Group();

  const tunicMaterial = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.6, metalness: 0.05 });
  const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xd8a878, roughness: 0.7 });
  const sashMaterial = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.6, roughness: 0.35 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.68, 2.2, 16), tunicMaterial);
  body.position.y = 1.1;
  group.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), skinMaterial);
  head.position.y = 2.5;
  group.add(head);

  const sash = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.06, 8, 16), sashMaterial);
  sash.rotation.x = Math.PI / 2;
  sash.position.y = 1.45;
  group.add(sash);

  group.traverse((child) => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });

  group.position.set(x, HALLWAY_FLOOR_Y, z);
  group.lookAt(0, HALLWAY_FLOOR_Y + 1.1, z); // face the walking path, not down the hall

  group.name = def.name;
  group.userData.isGuide = true;
  group.userData.name = def.name;
  group.userData.lines = def.lines;
  group.userData.tunicColor = def.color;

  hallwayGroup.add(group);
  return group;
}

const guideGroups = GUIDES.map(createGuide);

/* ====================================================================
   10. CAMERA CINEMATIC TRANSITION — the hourglass dive (Step 1, unchanged)
   ====================================================================
   HOW THE INTERPOLATION WORKS
   ----------------------------------------------------------------
   - `camStart` / `camEnd` are two fixed Vector3 positions; `lookStart` /
     `lookEnd` are the two points the camera aims at across the same span.
   - Every frame we compute `t` (0→1, elapsed/duration), ease it with
     `easeInOutCubic`, then feed both eased values into
     `Vector3.lerpVectors(a, b, easedT)` for that frame's camera position
     and look-at target.
   - This runs inside the requestAnimationFrame loop via THREE.Clock, so
     it always stays in lockstep with what's actually being rendered.
*/

const SAND_APEX_Y = -BULB_HEIGHT + 1.1;

const camStart = new THREE.Vector3(0, 2.5, 11);
const camEnd = new THREE.Vector3(0.35, SAND_APEX_Y + 0.25, 0.5);

const lookStart = new THREE.Vector3(0, 0, 0);
const lookEnd = new THREE.Vector3(0, SAND_APEX_Y - 0.3, 0.15);

camera.position.copy(camStart);
camera.lookAt(lookStart);

// Scratch vectors reused every frame by both the dive AND the travel below.
const _camPos = new THREE.Vector3();
const _lookPos = new THREE.Vector3();

function easeInOutCubic(t) {
  return t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ====================================================================
   11. ORBIT CONTROLS
   ====================================================================
   Disabled while either scripted camera sequence (the dive, then the
   travel) drives the camera. Enabled once the glide finishes at the
   hallway threshold — from then on it's repurposed as a "look-around on
   a leash" rig for first-person hallway navigation (see section 13).
*/
const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.copy(lookEnd);

/* ====================================================================
   12. THE TRAVEL ANIMATION — gliding across the dunes to the colonnade
   ====================================================================
   Same lerpVectors + easing technique as the hourglass dive, plus one
   addition: after computing the eased X/Z position, we OVERRIDE the
   camera's Y with the actual dune height sampled at that X/Z, so the
   shot hugs the rolling dunes instead of sliding along a flat line.

   THE NUMBERS BELOW ARE THE ONES TO TUNE FOR PACING/FRAMING:
*/

const TRAVEL_EYE_HEIGHT = 2.2; // "first-person" eye height above the ground, both outside and in the hallway
const TRAVEL_DURATION = 9;    // seconds — glide time from the sand mound to the hallway threshold
const TRAVEL_LOOKAHEAD = 60;  // how far past the *look-at* target leads the final camera position

const travelStart = camEnd.clone();
const travelLookStart = lookEnd.clone();

// The glide now ends exactly at the colonnade's threshold — HALLWAY_START_Z
// — handing off to manual first-person walking right as you cross into it.
const travelEnd = new THREE.Vector3(
  0,
  getTerrainHeight(0, HALLWAY_START_Z) + TRAVEL_EYE_HEIGHT,
  HALLWAY_START_Z
);

const travelLookEndZ = HALLWAY_START_Z - TRAVEL_LOOKAHEAD;
const travelLookEnd = new THREE.Vector3(0, HALLWAY_FLOOR_Y + TRAVEL_EYE_HEIGHT, travelLookEndZ);

function updateCameraTravel(travelElapsed) {
  const t = Math.min(travelElapsed / TRAVEL_DURATION, 1);
  const eased = easeInOutCubic(t);

  _camPos.lerpVectors(travelStart, travelEnd, eased);
  _lookPos.lerpVectors(travelLookStart, travelLookEnd, eased);

  camera.position.copy(_camPos);
  // Terrain-following Y — comment out to fall back to a straight-line glide.
  camera.position.y = getTerrainHeight(camera.position.x, camera.position.z) + TRAVEL_EYE_HEIGHT;

  camera.lookAt(_lookPos);
  controls.target.copy(_lookPos);

  return t;
}

/* ====================================================================
   13. FIRST-PERSON HALLWAY NAVIGATION
   ====================================================================
   Movement: the mouse wheel (or Arrow/W-S keys) sets a `targetPlayerZ`,
   clamped to stay inside the hallway. Each frame `playerZ` eases toward
   it with `THREE.MathUtils.damp` — an exponential, FRAME-RATE-INDEPENDENT
   smoothing function (unlike a fixed-factor lerp, its result doesn't
   change if your monitor runs at 60Hz vs 144Hz). Only the resulting
   PER-FRAME DELTA is applied to the camera, which is what keeps X locked
   dead-center — we only ever translate along Z, never sideways.

   Look-around: OrbitControls always aims the camera at `controls.target`.
   By keeping that target just a hair in front of the camera (radius
   LOOK_OFFSET_RADIUS) and pinning min/maxDistance to that same radius, a
   mouse-drag "orbit" only swings the camera through a tiny arc around a
   point right in front of your face — which reads as turning your head,
   not walking around an object. Translating camera + target by the same
   per-frame delta then moves this whole tiny "look rig" forward together
   without disturbing whatever direction you're currently looking.
*/

const WALK_SPEED = 14;          // units/second while an arrow/W-S key is held
const SCROLL_SPEED = 0.05;      // world units moved per wheel "tick" (deltaY)
const HALLWAY_DAMPING = 6;      // higher = snappier stop/start, lower = floatier glide
const LOOK_OFFSET_RADIUS = 0.15; // how far ahead of the camera the OrbitControls target sits

let playerZ = 0;
let targetPlayerZ = 0;
const keyState = { forward: false, backward: false };

function clampPlayerZ(z) {
  // A small margin keeps the camera from ever touching the geometry at
  // either end of the hallway.
  return THREE.MathUtils.clamp(z, HALLWAY_END_Z + 6, HALLWAY_START_Z);
}

function updateHallwayMovement(dt) {
  if (keyState.forward) targetPlayerZ -= WALK_SPEED * dt;
  if (keyState.backward) targetPlayerZ += WALK_SPEED * dt;
  targetPlayerZ = clampPlayerZ(targetPlayerZ);

  const previousPlayerZ = playerZ;
  playerZ = THREE.MathUtils.damp(playerZ, targetPlayerZ, HALLWAY_DAMPING, dt);
  const deltaZ = playerZ - previousPlayerZ;

  camera.position.z += deltaZ;
  controls.target.z += deltaZ;
}

function enterHallwayNavigation() {
  playerZ = camera.position.z;
  targetPlayerZ = playerZ;

  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  controls.target.copy(camera.position).addScaledVector(forward, LOOK_OFFSET_RADIUS);

  controls.minDistance = LOOK_OFFSET_RADIUS;
  controls.maxDistance = LOOK_OFFSET_RADIUS;
  controls.enableZoom = false; // the wheel drives walking now, not zoom/dolly
  controls.enablePan = false;  // no sideways drift — stay centered in the hallway
  controls.minPolarAngle = 0.15;
  controls.maxPolarAngle = Math.PI - 0.15;
  controls.enabled = true;
}

window.addEventListener('wheel', (event) => {
  if (sequenceState !== 'hallway' || dialogueOpen) return;
  targetPlayerZ = clampPlayerZ(targetPlayerZ - event.deltaY * SCROLL_SPEED);
}, { passive: true });

window.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W') keyState.forward = true;
  if (event.key === 'ArrowDown' || event.key === 's' || event.key === 'S') keyState.backward = true;
  if (dialogueOpen && event.key === 'Enter') { event.preventDefault(); closeDialogue(); }
});

window.addEventListener('keyup', (event) => {
  if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W') keyState.forward = false;
  if (event.key === 'ArrowDown' || event.key === 's' || event.key === 'S') keyState.backward = false;
});

/* ====================================================================
   14. HALLWAY LIGHTING TRANSITION
   ====================================================================
   Dims the outdoor ambient/hemisphere/sun lighting down to something
   "structural" the moment you cross into the colonnade, letting the
   warm SpotLights from section 8 become the dominant light source.
*/

const HALLWAY_LIGHT_TRANSITION_DURATION = 2.5;
let hallwayEnterElapsed = null;
let hallwayLightFrom = null;

function beginHallwayLightTransition(elapsed) {
  hallwayEnterElapsed = elapsed;
  hallwayLightFrom = {
    ambient: ambientLight.intensity,
    hemi: hemiLight.intensity,
    sun: sunLight.intensity,
  };
}

function updateHallwayLighting(elapsed) {
  const t = THREE.MathUtils.clamp((elapsed - hallwayEnterElapsed) / HALLWAY_LIGHT_TRANSITION_DURATION, 0, 1);
  const eased = easeInOutCubic(t);

  ambientLight.intensity = THREE.MathUtils.lerp(hallwayLightFrom.ambient, 0.18, eased);
  hemiLight.intensity = THREE.MathUtils.lerp(hallwayLightFrom.hemi, 0.15, eased);
  sunLight.intensity = THREE.MathUtils.lerp(hallwayLightFrom.sun, 0.4, eased); // a little still filters in between columns
}

/* ====================================================================
   15. MOUSE CLICK INTERACTIVITY — Raycasting & the RPG dialogue box
   ==================================================================== */

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

const dialogueBox = document.getElementById('dialogue-box');
const dialogueNameEl = document.getElementById('dialogue-name');
const dialogueTextEl = document.getElementById('dialogue-text');
const dialogueCloseBtn = document.getElementById('dialogue-close');

let dialogueOpen = false;

function pickGuideAt(clientX, clientY) {
  pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);

  const hits = raycaster.intersectObjects(guideGroups, true); // true: also test child meshes (body/head/sash)
  if (hits.length === 0) return null;

  // Guide meshes are children of a tagged Group — walk up until we find it.
  let obj = hits[0].object;
  while (obj && !obj.userData.isGuide) obj = obj.parent;
  return obj;
}

function openDialogue(guide) {
  dialogueOpen = true;
  controls.enabled = false; // pause camera movement AND look-around while talking

  const { name, lines, tunicColor } = guide.userData;
  dialogueNameEl.textContent = name;
  dialogueNameEl.style.background = '#' + tunicColor.toString(16).padStart(6, '0');
  dialogueTextEl.textContent = lines[Math.floor(Math.random() * lines.length)];

  dialogueBox.classList.remove('dialogue-hidden');
}

function closeDialogue() {
  dialogueOpen = false;
  dialogueBox.classList.add('dialogue-hidden');
  if (sequenceState === 'hallway') controls.enabled = true; // let the user walk (and look) again
}

canvas.addEventListener('click', (event) => {
  if (sequenceState !== 'hallway' || dialogueOpen) return;
  const guide = pickGuideAt(event.clientX, event.clientY);
  if (guide) openDialogue(guide);
});

// A hover cursor makes the guides read as clickable before you try.
canvas.addEventListener('pointermove', (event) => {
  if (sequenceState !== 'hallway' || dialogueOpen) { canvas.style.cursor = 'default'; return; }
  canvas.style.cursor = pickGuideAt(event.clientX, event.clientY) ? 'pointer' : 'default';
});

dialogueCloseBtn.addEventListener('click', closeDialogue);

/* ====================================================================
   16. SEQUENCE TIMING / STATE MACHINE
   ==================================================================== */

const ZOOM_DURATION = 4.5;
const FADE_START = 3.4;
const FADE_DURATION = 1.6;

// 'intro'     — camera dives into the hourglass sand (section 10)
// 'revealing' — hourglass fades out, dunes + archway + golden light fade in
// 'traveling' — first-person glide across the dunes to the colonnade (section 12)
// 'hallway'   — glide has finished; the visitor walks/looks freely and can talk to guides
let sequenceState = 'intro';
let travelStartElapsed = null;
let lastElapsed = 0; // used to derive a per-frame dt without double-consuming THREE.Clock

const clock = new THREE.Clock();

function updateCameraDive(elapsed) {
  const t = Math.min(elapsed / ZOOM_DURATION, 1);
  const eased = easeInOutCubic(t);

  _camPos.lerpVectors(camStart, camEnd, eased);
  _lookPos.lerpVectors(lookStart, lookEnd, eased);

  camera.position.copy(_camPos);
  camera.lookAt(_lookPos);
  controls.target.copy(_lookPos);

  return t;
}

function updateReveal(elapsed) {
  const fadeT = THREE.MathUtils.clamp((elapsed - FADE_START) / FADE_DURATION, 0, 1);
  const eased = easeInOutCubic(fadeT);

  glassMaterial.opacity = 1 - eased;
  capMaterial.opacity = 1 - eased;

  duneMaterial.opacity = eased;
  archMaterials.forEach((m) => { m.opacity = eased; });

  updateLighting(eased);

  return fadeT;
}

function updateLighting(eased) {
  const studioColor = new THREE.Color(0x05050a);
  const goldenSkyColor = new THREE.Color(0xffb27a);
  scene.background.copy(studioColor).lerp(goldenSkyColor, eased);
  scene.fog.color.copy(scene.background);
  scene.fog.density = THREE.MathUtils.lerp(0.035, 0.004, eased);

  ambientLight.intensity = THREE.MathUtils.lerp(0.6, 0.55, eased);
  ambientLight.color.set(0x404060).lerp(new THREE.Color(0xffdfb0), eased);

  hemiLight.intensity = THREE.MathUtils.lerp(0.15, 0.8, eased);
  hemiLight.color.set(0x111122).lerp(new THREE.Color(0xffb37a), eased);
  hemiLight.groundColor.set(0x000000).lerp(new THREE.Color(SAND_COLOR), eased);

  keyLight.intensity = THREE.MathUtils.lerp(6.0, 0, eased);
  rimLight.intensity = THREE.MathUtils.lerp(1.2, 0, eased);

  sunLight.intensity = THREE.MathUtils.lerp(0, 2.4, eased);
}

/* ====================================================================
   17. RENDER LOOP
   ==================================================================== */

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const dt = elapsed - lastElapsed; // manual per-frame delta — see note on `lastElapsed` above
  lastElapsed = elapsed;

  if (sequenceState === 'intro') {
    updateCameraDive(elapsed);
    if (elapsed >= FADE_START) {
      sequenceState = 'revealing';
      phaseLabel.textContent = 'Phase: Desert Reveal';
    }
  }

  if (sequenceState === 'revealing') {
    if (elapsed < ZOOM_DURATION) {
      updateCameraDive(elapsed);
    }
    const fadeT = updateReveal(elapsed);
    if (fadeT >= 1 && elapsed >= ZOOM_DURATION) {
      sequenceState = 'traveling';
      travelStartElapsed = elapsed;
      hourglassGroup.visible = false;
      keyLight.visible = false;
      camera.near = 0.05; // safe now that we're not millimeters from geometry
      camera.updateProjectionMatrix();
      phaseLabel.textContent = 'Phase: Riding the Dunes to the Archway';
    }
  }

  if (sequenceState === 'traveling') {
    const travelElapsed = elapsed - travelStartElapsed;
    const t = updateCameraTravel(travelElapsed);
    if (t >= 1) {
      sequenceState = 'hallway';
      enterHallwayNavigation();
      beginHallwayLightTransition(elapsed);
      phaseLabel.textContent = 'Phase: The Colonnade — scroll/arrows to walk, drag to look, click a guide to talk';
      phaseLabel.style.opacity = '0';
    }
  }

  if (sequenceState === 'hallway') {
    updateHallwayLighting(elapsed);
    if (!dialogueOpen) {
      updateHallwayMovement(dt);
      controls.update();
    }
  }

  renderer.render(scene, camera);
}

animate();

/* ====================================================================
   18. RESPONSIVE RESIZE
   ==================================================================== */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ====================================================================
   19. SWAPPING IN REAL GLTF MODELS (for later steps)
   ====================================================================
   HOURGLASS / ARCHWAY: see the notes carried over from Steps 1-2 — the
   short version is: load into the existing `hourglassGroup` /
   `archwayGroup`, push real materials into `archMaterials` so the fade
   in updateReveal() keeps working, and re-check the position constants
   that assume the placeholder geometry's dimensions.

   COLONNADE COLUMNS / GUIDES: `createColumn()` and `createGuide()` are
   the two functions to replace. Each already returns/adds a single
   Group positioned at a given (x, z) — swap the primitive meshes inside
   for a GLTFLoader call that loads into that same group, and everything
   that depends on position (the column spacing loop, `columnZs`, the
   guides' `columnIndex` lookups) keeps working unmodified. For guides,
   keep setting `group.userData.isGuide / .name / .lines / .tunicColor` on
   whatever group you return — that's the only contract section 15's
   raycaster and dialogue box actually depend on.
*/
</script>
